name: Wasm

on:
  push:
    paths-ignore:
    - '.devcontainer/**'
    - '.gitpod.yml'
    - '.vscode/**'
  pull_request:
    paths-ignore:
    - '.devcontainer/**'
    - '.gitpod.yml'
    - '.vscode/**'
  schedule:
    # Run against the last commit on the default branch on Friday at 8pm (UTC?)
    - cron: '0 20 * * 5'

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        # https://github.com/marketplace/actions/skip-duplicate-actions
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content'
          do_not_skip: '["pull_request", "workflow_dispatch", "schedule"]'

  build:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      # Continue running other jobs in the matrix even if one fails.
      fail-fast: false
      matrix:
        target:
          - wasm32-wasip1
          - wasm32-wasip2

    steps:
      - name: Checkout Moka
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build (sync, future)
        run: cargo build --lib --target ${{ matrix.target }} -F sync,future

      - name: Build (sync, future, logging, quanta)
        run: cargo build --lib --target ${{ matrix.target }} -F sync,future,logging,quanta

      - name: Build tests (sync, future)
        run: cargo test --no-run --target ${{ matrix.target }} -F sync,future --lib --tests

  test:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest

    env:
      # Many tests spawn threads, so run them on the wasi-threads target.
      # `--dir .` lets the tests read files in the crate directory.
      CARGO_TARGET_WASM32_WASIP1_THREADS_RUNNER: wasmtime run --dir . -W threads=y -S threads=y

    steps:
      - name: Checkout Moka
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-wasip1-threads

      - name: Install Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1

      # Wasm targets use `panic = "abort"`, so tests that expect to catch a panic
      # (`should_panic` and `handle_panic_*` tests) cannot run and are skipped.
      - name: Run tests (sync, future)
        run: >
          cargo test --target wasm32-wasip1-threads -F sync,future --lib --tests
          -- --skip panic
